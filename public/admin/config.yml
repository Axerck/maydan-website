backend:
  name: github
  repo: Axerck/maydan-website
  branch: cms-integration
  base_url: https://maydan-cms-auth.maydan-gestionale.workers.dev
  # Il CMS parla con GitHub passando dal worker: serve all'accesso con link per chi non ha
  # un account GitHub (il worker scambia la sessione con un token della GitHub App «Maydan
  # redazione»). Per chi entra con GitHub il worker inoltra e basta.
  # ATTENZIONE: da unire SOLO dopo aver pubblicato su maydan-gestionale la versione del worker
  # che ha /gh/ (codice comune con sesamo-auth): prima, il CMS si bloccherebbe per tutti.
  api_root: https://maydan-cms-auth.maydan-gestionale.workers.dev/gh/api/v3
  # Alla pubblicazione di una bozza, tutti i suoi salvataggi diventano un solo commit.
  squash_merges: true
  # Il nome di chi ha fatto la modifica nel messaggio di ogni salvataggio su GitHub.
  commit_messages:
    create: "Crea {{collection}} «{{slug}}» ({{author-name}})"
    update: "Modifica {{collection}} «{{slug}}» ({{author-name}})"
    delete: "Elimina {{collection}} «{{slug}}» ({{author-name}})"
    uploadMedia: "Carica {{path}} ({{author-name}})"
    deleteMedia: "Elimina {{path}} ({{author-name}})"

# Sviluppo locale: aprire /admin/index.html in un browser Chromium e cliccare
# "Work with Local Repository". Sveltia usa la File System Access API per
# scrivere direttamente sui file locali — niente proxy server.

# Bozze: «Salva» tiene il lavoro come bozza (su GitHub, non ancora sul sito) e si può
# riprendere quando si vuole; «Salva e pubblica» lo mette online. Nessuna revisione.
publish_mode:
  type: editorial_workflow
  stages: [draft]
  direct_publish: true

# Logo animato della schermata d'accesso (generato da src/pages/admin/logo.svg.ts con i colori della sezione «Logo»)
logo:
  src: /admin/logo.svg

media_folder: "public/img"
public_folder: "/img"

# File caricati: le foto diventano WebP al massimo di 2000 px (pesano molto meno),
# i nomi senza spazi né accenti, e niente oltre i 24 MB (Cloudflare non pubblica file oltre i 25 MB).
media_libraries:
  default:
    config:
      max_file_size: 24000000
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 2000
          height: 2000

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

collections:
  # ============ VOLUMI (italiano) ============
  - name: "volumi-it"
    label: "Volumi (IT)"
    label_singular: "Volume"
    folder: "src/pages/it/pubblicazioni"
    extension: "md"
    format: frontmatter
    create: true
    fields:
      - {label: "Layout", name: "layout", widget: "hidden", default: "../../../layouts/VolumeLayout.astro"}
      - {label: "Titolo", name: "title", widget: "string"}
      - {label: "Anno", name: "year", widget: "string"}
      - {label: "Data di uscita", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, required: false, hint: "Facoltativa. Serve al feed RSS (e quindi alla newsletter) per mettere il volume nell'ordine giusto."}
      - {label: "Copertina", name: "cover", widget: "image"}
      - {label: "Descrizione", name: "description", widget: "text"}
      - {label: "PDF volume completo", name: "pdf_full_link", widget: "file", required: false, media_folder: "/public/pdf/volumi", public_folder: "/pdf/volumi"}
      - label: "Prefazione"
        name: "prefazione"
        widget: "list"
        required: false
        fields:
          - {label: "Titolo (opzionale)", name: "titolo", widget: "string", required: false}
          - {label: "Autore", name: "autore", widget: "string"}
          - {label: "PDF", name: "pdf", widget: "file", media_folder: "/public/pdf/volumi", public_folder: "/pdf/volumi"}
      - label: "Editoriale"
        name: "editoriale"
        widget: "list"
        required: false
        fields:
          - {label: "Titolo (opzionale)", name: "titolo", widget: "string", required: false}
          - {label: "Autore", name: "autore", widget: "string"}
          - {label: "PDF", name: "pdf", widget: "file", media_folder: "/public/pdf/volumi", public_folder: "/pdf/volumi"}
      - label: "Articoli"
        name: "articoli"
        widget: "list"
        required: false
        fields:
          - {label: "Titolo", name: "titolo", widget: "string", hint: "Per parole in italic, usa *parole*"}
          - {label: "Autore", name: "autore", widget: "string"}
          - {label: "PDF", name: "pdf", widget: "file", media_folder: "/public/pdf/volumi", public_folder: "/pdf/volumi"}
      - label: "Working Papers"
        name: "working_paper"
        widget: "list"
        required: false
        fields:
          - {label: "Titolo", name: "titolo", widget: "string"}
          - {label: "Autore", name: "autore", widget: "string"}
          - {label: "PDF", name: "pdf", widget: "file", media_folder: "/public/pdf/volumi", public_folder: "/pdf/volumi"}
      - label: "Varia"
        name: "varia"
        widget: "list"
        required: false
        fields:
          - {label: "Titolo", name: "titolo", widget: "string"}
          - {label: "Autore", name: "autore", widget: "string"}
          - {label: "PDF", name: "pdf", widget: "file", media_folder: "/public/pdf/volumi", public_folder: "/pdf/volumi"}
      - label: "Recensioni"
        name: "recensioni"
        widget: "list"
        required: false
        fields:
          - {label: "Titolo", name: "titolo", widget: "string"}
          - {label: "Autore", name: "autore", widget: "string"}
          - {label: "PDF", name: "pdf", widget: "file", media_folder: "/public/pdf/volumi", public_folder: "/pdf/volumi"}

  # ============ VOLUMI (inglese) ============
  - name: "volumi-en"
    label: "Volumes (EN)"
    label_singular: "Volume"
    folder: "src/pages/en/pubblicazioni"
    extension: "md"
    format: frontmatter
    create: true
    fields:
      - {label: "Layout", name: "layout", widget: "hidden", default: "../../../layouts/VolumeLayout.astro"}
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Year", name: "year", widget: "string"}
      - {label: "Release date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, required: false, hint: "Optional. Used by the RSS feed (and so the newsletter) to order the issue correctly."}
      - {label: "Cover", name: "cover", widget: "image"}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Full Volume PDF", name: "pdf_full_link", widget: "file", required: false, media_folder: "/public/pdf/volumi", public_folder: "/pdf/volumi"}
      - label: "Preface"
        name: "prefazione"
        widget: "list"
        required: false
        fields:
          - {label: "Title (optional)", name: "titolo", widget: "string", required: false}
          - {label: "Author", name: "autore", widget: "string"}
          - {label: "PDF", name: "pdf", widget: "file", media_folder: "/public/pdf/volumi", public_folder: "/pdf/volumi"}
      - label: "Editorial"
        name: "editoriale"
        widget: "list"
        required: false
        fields:
          - {label: "Title (optional)", name: "titolo", widget: "string", required: false}
          - {label: "Author", name: "autore", widget: "string"}
          - {label: "PDF", name: "pdf", widget: "file", media_folder: "/public/pdf/volumi", public_folder: "/pdf/volumi"}
      - label: "Articles"
        name: "articoli"
        widget: "list"
        required: false
        fields:
          - {label: "Title", name: "titolo", widget: "string", hint: "For italic words, use *words*"}
          - {label: "Author", name: "autore", widget: "string"}
          - {label: "PDF", name: "pdf", widget: "file", media_folder: "/public/pdf/volumi", public_folder: "/pdf/volumi"}
      - label: "Working Papers"
        name: "working_paper"
        widget: "list"
        required: false
        fields:
          - {label: "Title", name: "titolo", widget: "string"}
          - {label: "Author", name: "autore", widget: "string"}
          - {label: "PDF", name: "pdf", widget: "file", media_folder: "/public/pdf/volumi", public_folder: "/pdf/volumi"}
      - label: "Varia"
        name: "varia"
        widget: "list"
        required: false
        fields:
          - {label: "Title", name: "titolo", widget: "string"}
          - {label: "Author", name: "autore", widget: "string"}
          - {label: "PDF", name: "pdf", widget: "file", media_folder: "/public/pdf/volumi", public_folder: "/pdf/volumi"}
      - label: "Reviews"
        name: "recensioni"
        widget: "list"
        required: false
        fields:
          - {label: "Title", name: "titolo", widget: "string"}
          - {label: "Author", name: "autore", widget: "string"}
          - {label: "PDF", name: "pdf", widget: "file", media_folder: "/public/pdf/volumi", public_folder: "/pdf/volumi"}

  # ============ ATTIVITÀ (italiano) ============
  - name: "attivita-it"
    label: "Attività (IT)"
    label_singular: "Attività"
    folder: "src/pages/it/attivita"
    extension: "md"
    format: frontmatter
    create: true
    fields:
      - {label: "Layout", name: "layout", widget: "hidden", default: "../../../layouts/ActivityLayout.astro"}
      - {label: "Titolo", name: "title", widget: "string"}
      - {label: "Data", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false}
      - {label: "Descrizione", name: "description", widget: "text"}
      - {label: "Copertina", name: "cover", widget: "image", required: false, media_folder: "/public/img/attivita", public_folder: "/img/attivita"}
      - {label: "Nascondi copertina nella pagina", name: "hide_cover", widget: "boolean", required: false, default: false}
      - label: "PDF allegati"
        name: "pdf_attachments"
        widget: "list"
        required: false
        fields:
          - {label: "Titolo", name: "titolo", widget: "string"}
          - {label: "URL", name: "url", widget: "file", media_folder: "/public/pdf/attivita", public_folder: "/pdf/attivita"}
          - {label: "Descrizione", name: "descrizione", widget: "string", required: false}
      - label: "Galleria immagini"
        name: "image_gallery"
        widget: "list"
        required: false
        fields:
          - {label: "Titolo (opzionale)", name: "titolo", widget: "string", required: false}
          - {label: "URL", name: "url", widget: "image", media_folder: "/public/img/attivita", public_folder: "/img/attivita"}
          - {label: "Alt text", name: "alt", widget: "string", required: false}
      - label: "CTA Link (opzionale)"
        name: "cta_link"
        widget: "object"
        required: false
        fields:
          - {label: "URL", name: "url", widget: "string"}
          - {label: "Etichetta bottone", name: "label", widget: "string"}
      - {label: "Contenuto", name: "body", widget: "markdown"}

  # ============ ATTIVITÀ (inglese) ============
  - name: "attivita-en"
    label: "Activities (EN)"
    label_singular: "Activity"
    folder: "src/pages/en/attivita"
    extension: "md"
    format: frontmatter
    create: true
    fields:
      - {label: "Layout", name: "layout", widget: "hidden", default: "../../../layouts/ActivityLayout.astro"}
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Cover", name: "cover", widget: "image", required: false, media_folder: "/public/img/attivita", public_folder: "/img/attivita"}
      - {label: "Hide cover on page", name: "hide_cover", widget: "boolean", required: false, default: false}
      - label: "PDF attachments"
        name: "pdf_attachments"
        widget: "list"
        required: false
        fields:
          - {label: "Title", name: "titolo", widget: "string"}
          - {label: "URL", name: "url", widget: "file", media_folder: "/public/pdf/attivita", public_folder: "/pdf/attivita"}
          - {label: "Description", name: "descrizione", widget: "string", required: false}
      - label: "Image gallery"
        name: "image_gallery"
        widget: "list"
        required: false
        fields:
          - {label: "Title (optional)", name: "titolo", widget: "string", required: false}
          - {label: "URL", name: "url", widget: "image", media_folder: "/public/img/attivita", public_folder: "/img/attivita"}
          - {label: "Alt text", name: "alt", widget: "string", required: false}
      - label: "CTA Link (optional)"
        name: "cta_link"
        widget: "object"
        required: false
        fields:
          - {label: "URL", name: "url", widget: "string"}
          - {label: "Button label", name: "label", widget: "string"}
      - {label: "Content", name: "body", widget: "markdown"}

  # ============ PAGINE (italiano) ============
  - name: "pagine-it"
    label: "Pagine (IT)"
    label_singular: "Pagina"
    folder: "src/pages/it/pagine"
    extension: "md"
    format: frontmatter
    create: true
    fields:
      - {label: "Layout", name: "layout", widget: "hidden", default: "../../../layouts/PageLayout.astro"}
      - {label: "Titolo", name: "title", widget: "string"}
      - {label: "Descrizione", name: "description", widget: "text", required: false, hint: "Usata per SEO e meta tag (1-2 frasi)"}
      - {label: "Copertina", name: "cover", widget: "image", required: false}
      - {label: "Nascondi copertina nella pagina", name: "hide_cover", widget: "boolean", required: false, default: false}
      - {label: "Contenuto", name: "body", widget: "markdown"}

  # ============ PAGES (inglese) ============
  - name: "pagine-en"
    label: "Pages (EN)"
    label_singular: "Page"
    folder: "src/pages/en/pagine"
    extension: "md"
    format: frontmatter
    create: true
    fields:
      - {label: "Layout", name: "layout", widget: "hidden", default: "../../../layouts/PageLayout.astro"}
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Description", name: "description", widget: "text", required: false, hint: "Used for SEO and meta tags (1-2 sentences)"}
      - {label: "Cover", name: "cover", widget: "image", required: false}
      - {label: "Hide cover on page", name: "hide_cover", widget: "boolean", required: false, default: false}
      - {label: "Content", name: "body", widget: "markdown"}

  # ============ HOMEPAGE (italiano) ============
  - name: "homepage-it"
    label: "Homepage (IT)"
    files:
      - label: "Contenuto homepage italiano"
        name: "homepage-it"
        file: "src/data/homepage-it.json"
        fields:
          - label: "Card Ultimo Numero"
            name: "latest_issue_card"
            widget: "object"
            fields:
              - {label: "Titolo", name: "title", widget: "string"}
              - {label: "Immagine", name: "image", widget: "image"}
              - {label: "Alt immagine", name: "image_alt", widget: "string"}
              - {label: "Descrizione", name: "description", widget: "text"}
              - label: "Link al volume"
                name: "link"
                widget: "relation"
                collection: "volumi-it"
                search_fields: ["title"]
                value_field: "/it/pubblicazioni/{{slug}}"
                display_fields: ["title", "year"]
                required: false
                hint: "Scegli il volume da linkare dalla collection 'Volumi (IT)'. L'URL si genera automaticamente."
              - {label: "Etichetta link", name: "link_label", widget: "string"}
          - label: "Card Comunicato"
            name: "comunicato_card"
            widget: "object"
            fields:
              - {label: "Titolo", name: "title", widget: "string"}
              - {label: "Immagine", name: "image", widget: "image"}
              - {label: "Alt immagine", name: "image_alt", widget: "string"}
              - {label: "Descrizione", name: "description", widget: "text"}
              - {label: "Link", name: "link", widget: "string"}
              - {label: "Etichetta link", name: "link_label", widget: "string"}
          - label: "Card Attività"
            name: "activities_card"
            widget: "object"
            fields:
              - {label: "Titolo", name: "title", widget: "string"}
              - label: "Voci in elenco"
                name: "items"
                widget: "list"
                fields:
                  - {label: "Etichetta", name: "label", widget: "string"}
                  - label: "Link all'attività"
                    name: "link"
                    widget: "relation"
                    collection: "attivita-it"
                    search_fields: ["title"]
                    value_field: "/it/attivita/{{slug}}"
                    display_fields: ["title", "date"]
                    required: false
                    hint: "Scegli un'attività dalla collection 'Attività (IT)'. Lascia vuoto se vuoi solo testo non cliccabile."
              - {label: "Link principale", name: "main_link", widget: "string"}
              - {label: "Etichetta link principale", name: "main_link_label", widget: "string"}
              - label: "Sezione 'Altro' (opzionale)"
                name: "altro_section"
                widget: "object"
                required: false
                collapsed: true
                hint: "Sotto la lista delle attività, una sezione opzionale per promuovere pagine custom create in 'Pagine'."
                fields:
                  - {label: "Titolo sezione", name: "title", widget: "string", default: "Altro"}
                  - label: "Voci"
                    name: "items"
                    widget: "list"
                    required: false
                    fields:
                      - {label: "Etichetta", name: "label", widget: "string"}
                      - label: "Link alla pagina"
                        name: "link"
                        widget: "relation"
                        collection: "pagine-it"
                        search_fields: ["title"]
                        value_field: "/it/pagine/{{slug}}"
                        display_fields: ["title"]
                        required: false
          - label: "Collaborazioni"
            name: "collaborations"
            widget: "object"
            fields:
              - {label: "Titolo sezione", name: "title", widget: "string"}
              - label: "Loghi"
                name: "logos"
                widget: "list"
                fields:
                  - {label: "Nome", name: "name", widget: "string"}
                  - {label: "Immagine", name: "image", widget: "image"}
                  - {label: "URL", name: "url", widget: "string"}

  # ============ HOMEPAGE (inglese) ============
  - name: "homepage-en"
    label: "Homepage (EN)"
    files:
      - label: "Homepage English content"
        name: "homepage-en"
        file: "src/data/homepage-en.json"
        fields:
          - label: "Latest Issue Card"
            name: "latest_issue_card"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Image", name: "image", widget: "image"}
              - {label: "Image alt", name: "image_alt", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
              - label: "Link to volume"
                name: "link"
                widget: "relation"
                collection: "volumi-en"
                search_fields: ["title"]
                value_field: "/en/pubblicazioni/{{slug}}"
                display_fields: ["title", "year"]
                required: false
                hint: "Pick the volume to link from 'Volumes (EN)' collection. URL auto-generated."
              - {label: "Link label", name: "link_label", widget: "string"}
          - label: "Comunicato Card"
            name: "comunicato_card"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Image", name: "image", widget: "image"}
              - {label: "Image alt", name: "image_alt", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
              - {label: "Link", name: "link", widget: "string"}
              - {label: "Link label", name: "link_label", widget: "string"}
          - label: "Activities Card"
            name: "activities_card"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - label: "List items"
                name: "items"
                widget: "list"
                fields:
                  - {label: "Label", name: "label", widget: "string"}
                  - label: "Activity link"
                    name: "link"
                    widget: "relation"
                    collection: "attivita-en"
                    search_fields: ["title"]
                    value_field: "/en/attivita/{{slug}}"
                    display_fields: ["title", "date"]
                    required: false
                    hint: "Pick an activity from 'Activities (EN)'. Leave empty for plain text without link."
              - {label: "Main link", name: "main_link", widget: "string"}
              - {label: "Main link label", name: "main_link_label", widget: "string"}
              - label: "'Altro' section (optional)"
                name: "altro_section"
                widget: "object"
                required: false
                collapsed: true
                hint: "Below the activities list, an optional section to feature custom pages from the 'Pages' collection."
                fields:
                  - {label: "Section title", name: "title", widget: "string", default: "Other"}
                  - label: "Items"
                    name: "items"
                    widget: "list"
                    required: false
                    fields:
                      - {label: "Label", name: "label", widget: "string"}
                      - label: "Page link"
                        name: "link"
                        widget: "relation"
                        collection: "pagine-en"
                        search_fields: ["title"]
                        value_field: "/en/pagine/{{slug}}"
                        display_fields: ["title"]
                        required: false
          - label: "Collaborations"
            name: "collaborations"
            widget: "object"
            fields:
              - {label: "Section title", name: "title", widget: "string"}
              - label: "Logos"
                name: "logos"
                widget: "list"
                fields:
                  - {label: "Name", name: "name", widget: "string"}
                  - {label: "Image", name: "image", widget: "image"}
                  - {label: "URL", name: "url", widget: "string"}

  # ============ CALL E LINEE GUIDA (italiano) ============
  - name: "call-e-linee-guida-it"
    label: "Call e linee guida (IT)"
    files:
      - label: "Contenuto pagina call e linee guida"
        name: "call-it"
        file: "src/data/call-e-linee-guida-it.json"
        fields:
          - label: "Call attiva"
            name: "active_call"
            widget: "object"
            hint: "La call attualmente in corso, nella sezione 'Ultime Call for Papers' di questa pagina e nel feed RSS. È anche il riquadro in cima alla homepage: si aggiorna da qui."
            fields:
              - {label: "Titolo sezione", name: "section_title", widget: "string", default: "Ultime Call for Papers"}
              - {label: "Titolo call", name: "title", widget: "string"}
              - {label: "Data di pubblicazione", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, required: false, hint: "Il giorno in cui la call esce. Serve al feed RSS: cambiala a ogni call nuova."}
              - {label: "Immagine", name: "image", widget: "image"}
              - {label: "Alt immagine", name: "image_alt", widget: "string"}
              - {label: "Link al PDF", name: "pdf_link", widget: "file", media_folder: "/public/pdf/calls", public_folder: "/pdf/calls"}
              - label: "Link «Leggi tutto» (opzionale)"
                name: "more_link"
                widget: "relation"
                collection: "attivita-it"
                search_fields: ["title"]
                value_field: "/it/attivita/{{slug}}"
                display_fields: ["title", "date"]
                required: false
                hint: "Un'attività con tutti i dettagli. Lascia vuoto per non mostrare il link."
              - {label: "Etichetta «Leggi tutto»", name: "more_label", widget: "string", required: false, default: "Leggi tutto"}
              - label: "Scadenze"
                name: "deadlines"
                widget: "list"
                hint: "Una riga per voce. Per il grassetto usa **testo**, es. '**Scadenza per abstract:** 17/12/2025'. Le stesse righe compaiono nel riquadro in cima alla homepage."
                field: {label: "Scadenza", name: "deadline", widget: "string"}
          - label: "Linee guida per gli autori"
            name: "linee_guida"
            widget: "object"
            fields:
              - {label: "Titolo sezione", name: "section_title", widget: "string", default: "Linee Guida per gli Autori"}
              - label: "Documenti"
                name: "documents"
                widget: "list"
                fields:
                  - {label: "Etichetta", name: "label", widget: "string"}
                  - {label: "PDF", name: "pdf", widget: "file", media_folder: "/public/pdf/calls", public_folder: "/pdf/calls"}
          - label: "Call passate"
            name: "past_calls"
            widget: "object"
            hint: "Quando esce una nuova call, sposta qui la vecchia: clicca '+' nella lista, copia titolo/immagine/PDF della call attiva precedente, poi aggiorna la call attiva sopra."
            fields:
              - {label: "Titolo sezione", name: "section_title", widget: "string", default: "Call for Papers Passate"}
              - label: "Card delle call passate"
                name: "items"
                widget: "list"
                summary: "{{title}}"
                fields:
                  - {label: "Titolo", name: "title", widget: "string"}
                  - {label: "Immagine", name: "image", widget: "image"}
                  - {label: "Alt immagine", name: "image_alt", widget: "string"}
                  - {label: "Link al PDF", name: "pdf_link", widget: "file", media_folder: "/public/pdf/calls", public_folder: "/pdf/calls"}

  # ============ CALL E LINEE GUIDA (inglese) ============
  - name: "call-e-linee-guida-en"
    label: "Calls & Guidelines (EN)"
    files:
      - label: "Calls & guidelines page content"
        name: "call-en"
        file: "src/data/call-e-linee-guida-en.json"
        fields:
          - label: "Active call"
            name: "active_call"
            widget: "object"
            hint: "The currently active call, shown in the 'Latest Call for Papers' section of this page and in the RSS feed. It is also the box at the top of the homepage: edit it here."
            fields:
              - {label: "Section title", name: "section_title", widget: "string", default: "Latest Call for Papers"}
              - {label: "Call title", name: "title", widget: "string"}
              - {label: "Publication date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, required: false, hint: "The day the call is published. Used by the RSS feed: update it with every new call."}
              - {label: "Image", name: "image", widget: "image"}
              - {label: "Image alt", name: "image_alt", widget: "string"}
              - {label: "PDF link", name: "pdf_link", widget: "file", media_folder: "/public/pdf/calls", public_folder: "/pdf/calls"}
              - label: "“Read more” link (optional)"
                name: "more_link"
                widget: "relation"
                collection: "attivita-en"
                search_fields: ["title"]
                value_field: "/en/attivita/{{slug}}"
                display_fields: ["title", "date"]
                required: false
                hint: "An activity with all the details. Leave empty to hide the link."
              - {label: "“Read more” label", name: "more_label", widget: "string", required: false, default: "Read more"}
              - label: "Deadlines"
                name: "deadlines"
                widget: "list"
                hint: "One line per item. For bold use **text**, e.g. '**Abstract deadline:** 17/12/2025'. The same lines appear in the box at the top of the homepage."
                field: {label: "Deadline", name: "deadline", widget: "string"}
          - label: "Author guidelines"
            name: "linee_guida"
            widget: "object"
            fields:
              - {label: "Section title", name: "section_title", widget: "string", default: "Author Guidelines"}
              - label: "Documents"
                name: "documents"
                widget: "list"
                fields:
                  - {label: "Label", name: "label", widget: "string"}
                  - {label: "PDF", name: "pdf", widget: "file", media_folder: "/public/pdf/calls", public_folder: "/pdf/calls"}
          - label: "Past calls"
            name: "past_calls"
            widget: "object"
            hint: "When a new call is published, move the old one here: click '+' in the list, copy title/image/PDF of the previous active call, then update the active call section above."
            fields:
              - {label: "Section title", name: "section_title", widget: "string", default: "Past Call for Papers"}
              - label: "Past call cards"
                name: "items"
                widget: "list"
                summary: "{{title}}"
                fields:
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "Image", name: "image", widget: "image"}
                  - {label: "Image alt", name: "image_alt", widget: "string"}
                  - {label: "PDF link", name: "pdf_link", widget: "file", media_folder: "/public/pdf/calls", public_folder: "/pdf/calls"}

  # ============ TEAM (un solo file JSON) ============
  - name: "team"
    label: "Team"
    files:
      - label: "Membri del team"
        name: "team"
        file: "src/data/team.json"
        fields:
          - label: "Membri"
            name: "members"
            widget: "list"
            summary: "{{name}} — {{role}} ({{affiliation}})"
            fields:
              - {label: "Nome", name: "name", widget: "string"}
              - {label: "Slug (URL)", name: "slug", widget: "string", pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', "Solo lettere minuscole, numeri e trattini (es. mario-rossi)"], hint: "Diventa l'indirizzo della pagina: deve essere unico. Niente spazi, solo trattini."}
              - {label: "Ruolo principale / Titolo", name: "role", widget: "string", hint: "Ruolo identitario in Maydan (es. fondatore, direttore emerito). Per il ruolo operativo attuale o storico, vedi la collection 'Struttura redazione'."}
              - {label: "Affiliazione", name: "affiliation", widget: "string", required: false}
              - {label: "Affiliazione (EN)", name: "affiliation_en", widget: "string", required: false}
              - {label: "Bio (IT)", name: "bio", widget: "text", required: false}
              - {label: "Bio (EN)", name: "bio_en", widget: "text", required: false}
              - {label: "Foto", name: "image", widget: "image", required: false, media_folder: "/public/team", public_folder: "/team"}
              - {label: "Link personale", name: "personalLink", widget: "string", required: false}
              - {label: "Email", name: "email", widget: "string", required: false}

  # ============ STRUTTURA REDAZIONE (un solo file JSON) ============
  - name: "struttura"
    label: "Struttura redazione"
    files:
      - label: "Comitati della redazione"
        name: "boards"
        file: "src/data/structure.json"
        fields:
          - label: "Comitati"
            name: "boards"
            widget: "list"
            summary: "Comitato {{year}}"
            collapsed: true
            hint: "Il comitato con l'anno più recente è quello corrente; gli altri finiscono in «Redazioni precedenti», ognuno con la sua pagina. Per un comitato nuovo: apri il menu ⋮ del comitato corrente, scegli «Duplica», poi nella copia cambia l'anno e i membri. Il vecchio diventa passato da solo."
            fields:
              - {label: "Anno", name: "year", widget: "string", pattern: ['^\d{4}$', "Anno a 4 cifre (es. 2027)"], hint: "Ogni comitato deve avere un anno diverso."}
              - label: "Gruppi"
                name: "groups"
                widget: "list"
                summary: "{{title}}"
                fields:
                  - {label: "Titolo gruppo", name: "title", widget: "string"}
                  - {label: "Titolo gruppo (EN)", name: "title_en", widget: "string", required: false, hint: "Il titolo sul sito inglese, es. «Editorial Board». Se vuoto resta quello italiano."}
                  - label: "Membri"
                    name: "members"
                    widget: "list"
                    summary: "{{slug}}"
                    fields:
                      - label: "Membro"
                        name: "slug"
                        widget: "relation"
                        collection: "team"
                        file: "team"
                        value_field: "{{members.*.slug}}"
                        search_fields: ["{{members.*.name}}"]
                        display_fields: ["{{members.*.name}}"]
                        hint: "Scegli dalla lista del Team. Se la persona non c'è, aggiungila prima in Team."

  # ============ LOGO (un solo file JSON) ============
  - name: "logo"
    label: "Logo"
    files:
      - label: "Colori del logo"
        name: "logo"
        file: "src/data/logo.json"
        fields:
          - label: "Colori fissi"
            name: "rest"
            widget: "object"
            hint: "I colori del logo nell'intestazione del sito. Per il logo in bianco e nero metti lo stesso colore (#000000) ai tre gruppi di triangoli."
            fields:
              - {label: "Triangoli grandi (la forma principale)", name: "big", widget: "color", default: "#000000"}
              - {label: "Triangolo solitario (a sinistra)", name: "lone", widget: "color", default: "#ff0000"}
              - {label: "Triangoli piccoli (in basso)", name: "small", widget: "color", default: "#008000"}
              - {label: "Scritta «Maydan»", name: "text", widget: "color", default: "#000000"}
          - label: "Animazione"
            name: "loading"
            widget: "object"
            hint: "Alla prima visita i triangoli si posano uno alla volta con questi colori; mentre si apre una pagina, i colori passano sui triangoli come un'onda."
            fields:
              - {label: "Colora il logo durante i caricamenti", name: "enabled", widget: "boolean", default: true}
              - label: "Colori dell'animazione"
                name: "palette"
                widget: "list"
                hint: "I triangoli li usano a turno. Ne bastano 2–6."
                min: 1
                max: 8
                field: {label: "Colore", name: "color", widget: "color"}

  # ============ PAGINE DEL SITO (testi delle pagine fisse) ============
  - name: "pagine-sito"
    label: "Pagine del sito"
    description: "I testi delle pagine fisse: Chi siamo, Contatti, Comunicato."
    files:
      - label: "Chi siamo (IT)"
        name: "chi-siamo-it"
        file: "src/data/pagine/chi-siamo-it.md"
        fields:
          - {label: "Titolo della scheda del browser", name: "title", widget: "string", hint: "Compare nella scheda del browser e su Google."}
          - {label: "Descrizione per Google", name: "description", widget: "text"}
          - {label: "Testo", name: "body", widget: "markdown"}
      - label: "About us (EN)"
        name: "chi-siamo-en"
        file: "src/data/pagine/chi-siamo-en.md"
        fields:
          - {label: "Browser tab title", name: "title", widget: "string", hint: "Shown in the browser tab and on Google."}
          - {label: "Description for Google", name: "description", widget: "text"}
          - {label: "Text", name: "body", widget: "markdown"}
      - label: "Contatti (IT)"
        name: "contatti-it"
        file: "src/data/contatti-it.json"
        fields: &contatti
          - {label: "Titolo della scheda del browser", name: "seo_title", widget: "string"}
          - {label: "Descrizione per Google", name: "seo_description", widget: "text"}
          - label: "Riquadro proposte e contributi"
            name: "submissions"
            widget: "object"
            fields:
              - {label: "Titolo", name: "title", widget: "string"}
              - {label: "Testo", name: "text", widget: "string"}
              - {label: "Email", name: "email", widget: "string", pattern: ['^[^@\s]+@[^@\s]+\.[^@\s]+$', "Scrivi un indirizzo email valido"]}
          - label: "Riquadro reclami"
            name: "complaints"
            widget: "object"
            fields:
              - {label: "Titolo", name: "title", widget: "string"}
              - {label: "Testo", name: "text", widget: "string"}
              - {label: "Email", name: "email", widget: "string", pattern: ['^[^@\s]+@[^@\s]+\.[^@\s]+$', "Scrivi un indirizzo email valido"]}
          - label: "Riquadro collabora"
            name: "collaborate"
            widget: "object"
            fields:
              - {label: "Titolo", name: "title", widget: "string"}
              - {label: "Testo", name: "text", widget: "text"}
              - {label: "Riga con gli indirizzi", name: "contact_line", widget: "string", hint: "Gli indirizzi email scritti qui diventano link da soli."}
          - label: "Riquadro newsletter"
            name: "newsletter"
            widget: "object"
            fields:
              - {label: "Titolo", name: "title", widget: "string"}
              - {label: "Testo", name: "text", widget: "text"}
          - label: "Riquadro sostienici"
            name: "support"
            widget: "object"
            fields:
              - {label: "Titolo", name: "title", widget: "string"}
              - {label: "Testo", name: "text", widget: "text"}
              - {label: "Testo del pulsante", name: "button_label", widget: "string"}
              - {label: "Link per le donazioni", name: "url", widget: "string"}
      - label: "Contacts (EN)"
        name: "contatti-en"
        file: "src/data/contatti-en.json"
        fields: *contatti
      - label: "Comunicato"
        name: "comunicato"
        file: "src/data/pagine/comunicato.json"
        fields:
          - {label: "Titolo della scheda del browser", name: "seo_title", widget: "string"}
          - {label: "Descrizione per Google", name: "seo_description", widget: "text"}
          - {label: "Titolo", name: "title", widget: "string"}
          - {label: "Immagine", name: "image", widget: "image"}
          - {label: "Testo alternativo dell'immagine", name: "image_alt", widget: "string"}
          - label: "Sezioni (una per lingua)"
            name: "sections"
            widget: "list"
            summary: "{{lang_title}}"
            fields:
              - {label: "Titolo della sezione", name: "lang_title", widget: "string"}
              - {label: "Da destra a sinistra (arabo)", name: "rtl", widget: "boolean", default: false}
              - {label: "Titolo con immagine (facoltativo)", name: "heading", widget: "string", required: false, hint: "Se c'è, la sezione si apre con l'immagine e questo titolo."}
              - {label: "Testo", name: "body", widget: "markdown"}
              - {label: "PDF da scaricare (facoltativo)", name: "pdf", widget: "file", required: false, media_folder: "/public/pdf/comunicati", public_folder: "/pdf/comunicati"}
              - {label: "Testo del pulsante di download", name: "pdf_label", widget: "string", required: false}

  # ============ COMITATO SCIENTIFICO (un solo file JSON) ============
  - name: "comitato-scientifico"
    label: "Comitato scientifico"
    files:
      - label: "Membri del comitato scientifico"
        name: "comitato-scientifico"
        file: "src/data/comitato-scientifico.json"
        fields:
          - label: "Membri"
            name: "members"
            widget: "list"
            summary: "{{name}} — {{affiliation}}"
            fields:
              - {label: "Nome", name: "name", widget: "string"}
              - {label: "Link alla pagina personale", name: "url", widget: "string", required: false}
              - {label: "Affiliazione", name: "affiliation", widget: "string", required: false}
              - {label: "Affiliazione (EN)", name: "affiliation_en", widget: "string", required: false}
